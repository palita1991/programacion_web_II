{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'viajes/css/viajes.css' %}">
{% endblock %}
{% block content %}
<div class="registro">
    <h4>Registro de Usuario</h4>
    <form method="POST" class="form-auth">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="d-flex gap-2 mt-4 justify-content-center">
            <button type="submit" class="btn btn-primary" style="cursor: pointer;width: 100%">Registrarse</button>
        </div>

    </form>
    <div class="d-flex justify-content-end">
        <p style="margin-top: 15px; width: 100%">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div>
</div>
{% endblock %}
